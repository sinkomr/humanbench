name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci || npm ci

      # A deploy must pass the same gates as CI: typecheck (incl. a11y warnings) and tests.
      - run: npm run check
      - run: npm test

      # base_path is "/humanbench" on sinkomr.github.io and "" on a custom domain (DESIGN §15).
      # The online version (ROADMAP M2.6, M2.7): the project's URL and its anon / publishable key,
      # both public, come from the repository VARIABLES HB_SUPABASE_URL and HB_SUPABASE_ANON_KEY
      # (Settings > Secrets and variables > Actions > Variables). With either one unset the build
      # is the static version, which sends nothing (web/src/backend/config.ts). Never a secret
      # here, and never the service-role key: everything in this build is served to every visitor.
      # The served text parts (ROADMAP M3.11 phase 1): the repository variable HB_TEXT_AXES names the
      # skills whose text questions the session asks the server for (LR,VOC,KST,KHU,KAP, or "all").
      # Unset, the session is the six-part one, unchanged. Set it only once the bank's questions for
      # a skill are loaded; a skill the server has no questions for is still left out of the session.
      - run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_HB_SUPABASE_URL: ${{ vars.HB_SUPABASE_URL }}
          VITE_HB_SUPABASE_ANON_KEY: ${{ vars.HB_SUPABASE_ANON_KEY }}
          VITE_HB_TEXT_AXES: ${{ vars.HB_TEXT_AXES }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
