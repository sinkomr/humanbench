name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded runs on feature branches and PRs are cancelled; every run on main completes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: web (check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    # Playwright + axe-core (ROADMAP M1.A): builds the app, serves it with `vite preview` under
    # /humanbench/, and runs e2e/ in Chromium, WebKit and iPhone 13 (WebKit) emulation.
    # One job per Playwright project: ~530 tests on 2 workers outgrew a single 20-min job.
    name: web e2e (Playwright + axe, ${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit, iphone]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Browser binaries are keyed on the exact Playwright version in the lockfile.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit

      - name: Install browsers and their system dependencies
        if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: npm run e2e:install

      # apt mirrors occasionally hang; fail fast instead of eating the job budget.
      - name: Install the browsers' system dependencies (browsers cached)
        if: steps.browsers.outputs.cache-hit == 'true'
        timeout-minutes: 8
        run: npx playwright install-deps chromium webkit

      - run: npm run e2e -- --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
          if-no-files-found: ignore
